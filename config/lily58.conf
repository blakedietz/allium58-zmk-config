# BLE advertises this name (max 16 chars). Without it the board announces
# whatever the lily58 shield defaults to, rather than the Allium58 it is.
CONFIG_ZMK_KEYBOARD_NAME="Allium58"

# Uncomment to enable encoder
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the Lily58 OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_POINTING=y

# Soft-off: hold &soft_off (dev layer) to power down; wake via the reset button
CONFIG_ZMK_PM_SOFT_OFF=y

# Deep sleep is OFF by default in ZMK (CONFIG_ZMK_SLEEP=n), so without this the
# board only ever reaches the idle state -- on a wireless split driving two
# nice!views that is the largest battery cost available to remove.
#
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT is left at its 900000ms (15 min) default. Unlike
# &soft_off above, deep sleep wakes on any keypress, so it needs no escape hatch.
CONFIG_ZMK_SLEEP=y
